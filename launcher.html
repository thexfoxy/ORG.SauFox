<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Language: the visitor's choice, else Persian if their browser prefers
    // it. A Persian page stays hidden until js/main.js has put its text in.
    (function () {
      var lang = "en";
      try {
        // ?lang=fa or ?lang=en in the address wins (links, search engines).
        var asked = /[?&]lang=(fa|en)(&|$)/.exec(location.search);
        if (asked) lang = asked[1];
        if (asked) localStorage.setItem("saufox.lang", lang);
        else lang = localStorage.getItem("saufox.lang") ||
          ((navigator.languages || [navigator.language]).some(function (l) { return /^fa\b/i.test(l); }) ? "fa" : "en");
      } catch (e) {}
      if (lang !== "fa") return;
      var root = document.documentElement;
      root.lang = "fa";
      root.dir = "rtl";
      root.classList.add("i18n-pending");
      setTimeout(function () { root.classList.remove("i18n-pending"); }, 2500);
    })();
  </script>
  <meta name="robots" content="noindex">
  <title>Launcher sign-in · SauFox Entertainment</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#0f0f11">
  <link rel="preload" href="/assets/fonts/great-vibes.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/style.css?v=43">
</head>
<body class="status-page">
  <!-- Signs the SauFox launcher in: launcher.html?port=<port>&state=<state>.
       The launcher listens on http://127.0.0.1:<port>/callback and gets
       ?state=…&token_hash=…&email=… (or ?state=…&error=cancelled); it turns
       token_hash into its own session with auth.verifyOtp({ token_hash,
       type: "magiclink" }). js/main.js (launcherPage) runs it. -->
  <header class="status-top">
    <a class="status-brand" href="/index.html">SauFox <span>Entertainment</span></a>
    <button class="lang-switch" type="button" data-lang-switch translate="no">فارسی</button>
  </header>

  <main class="status launcher-page" data-reason="launcher">
    <p class="status__mark" aria-hidden="true" translate="no">SauFox</p>
    <h1 class="status__title">Checking your account…</h1>
    <p class="status__text"></p>
    <div class="status__actions"></div>
    <p class="status__hint" role="status" aria-live="polite"></p>
  </main>

  <script src="/js/vendor/supabase.js?v=43" defer></script>
  <script src="/js/fa.js?v=43" defer></script>
  <script src="/js/main.js?v=43" defer></script>
</body>
</html>
