<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Clean addresses: never ".html" in the address bar (GitHub Pages
    // serves /work for work.html), and the home page is just "/". Pages
    // start at the top: the browser doesn't bring back the old scroll
    // position, and a reload or Back forgets any "#section" too.
    (function () {
      // Never inside another site's frame (clickjacking): GitHub Pages
      // can't send X-Frame-Options, so the page leaves the frame itself,
      // or stays blank if it can't.
      if (window.top !== window.self) {
        document.documentElement.style.display = "none";
        try { window.top.location = window.location.href; } catch (e) {}
        return;
      }
      try {
        var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
        var fresh = nav && (nav.type === "reload" || nav.type === "back_forward");
        var p = location.pathname, c = p.replace(/\/index\.html$/, "/").replace(/\.html$/, "");
        var hash = fresh ? "" : location.hash;
        if (c !== p || hash !== location.hash) history.replaceState(history.state, "", c + location.search + hash);
        if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      } catch (e) {}
    })();
  </script>
  <script>
    // Language: the visitor's choice, else Persian if their browser prefers
    // it. A Persian page stays hidden until js/main.js has put its text in.
    (function () {
      var lang = "en";
      try {
        // ?lang=fa or ?lang=en in the address wins (links, search engines).
        var asked = /[?&]lang=(fa|en)(&|$)/.exec(location.search);
        if (asked) lang = asked[1];
        if (asked) localStorage.setItem("saufox.lang", lang);
        else lang = localStorage.getItem("saufox.lang") ||
          ((navigator.languages || [navigator.language]).some(function (l) { return /^fa\b/i.test(l); }) ? "fa" : "en");
      } catch (e) {}
      if (lang !== "fa") return;
      var root = document.documentElement;
      root.lang = "fa";
      root.dir = "rtl";
      root.classList.add("i18n-pending");
      setTimeout(function () { root.classList.remove("i18n-pending"); }, 2500);
    })();
  </script>
  <meta name="robots" content="noindex">

       first and comes back. js/main.js (portalSignin) runs it. -->
  <header class="status-top">

    <p class="status__text"></p>
    <div class="status__actions"></div>
    <p class="status__hint" role="status" aria-live="polite"></p>
  </main>
