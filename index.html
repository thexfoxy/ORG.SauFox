<!doctype html>
<html lang="en" data-auth="new">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SauFox Entertainment</title>
  <meta name="description" content="SauFox Entertainment — games, animation, short films, feature films and novels, in physical and digital editions.">
  <link rel="preload" href="assets/fonts/great-vibes.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/barlow-condensed-700i.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Set the auth state before first paint so the header never flickers.
    // member    = signed in              -> profile chip, no CTA
    // returning = has an account, signed out -> "Login"
    // new       = first visit / no account   -> "Wanna create an account?"
    // `?demo=<state>` overrides it for previews.
    (function () {
      var state = "new";
      try {
        var demo = new URLSearchParams(location.search).get("demo");
        if (demo === "new" || demo === "returning" || demo === "member") state = demo;
        else if (localStorage.getItem("saufox.session")) state = "member";
        else if (localStorage.getItem("saufox.hasAccount")) state = "returning";
      } catch (e) {}
      document.documentElement.dataset.auth = state;
    })();
  </script>
</head>
<body>
  <!-- Section 1: Header -->
  <header class="site-header">
    <div class="site-header__inner">
      <a class="profile-chip" href="profile.html" aria-label="Profile">
        <span class="profile-chip__avatar">
          <img src="assets/avatar-default.svg" alt="">
        </span>
        <span class="profile-chip__label">Profile</span>
      </a>

      <a class="brand" href="index.html" aria-label="SauFox Entertainment">
        <span class="brand__text">SauFox<span class="brand__sub"> Entertainment</span></span>
        <span class="brand__blur" aria-hidden="true">SauFox<span class="brand__sub"> Entertainment</span></span>
      </a>

      <a class="cta cta--login" href="login.html" data-animate-letters data-hover-text="Welcome Back">Login</a>
      <a class="cta cta--signup" href="login.html#signup" data-animate-letters data-hover-text="Sign Up Now">Wanna create an account?</a>
    </div>
  </header>

  <main>
    <!-- Section 2: Hero — a free-standing collage of random artwork from the
         studio's releases (games, animation, films, novels alike). Slanted
         panels; the bottom edge falls away in a curve. js/main.js fills the
         panels from its WORKS list and swaps one now and then. -->
    <section class="hero" aria-label="Artwork from SauFox releases"></section>

    <!-- Section 3: Studio slogan. Tucked into the space the hero's curve
         leaves on the left. -->
    <section class="slogan">
      <blockquote class="slogan__quote">
        <p>And my success is not but through God.</p>
        <cite>Qur&rsquo;an 11:88</cite>
      </blockquote>
    </section>

    <!-- Section 4: Work cards. Each card: image slider, price that cycles
         through currencies, and a separate status box. js/main.js renders
         them from its CATALOG list. -->
    <section class="works" aria-label="Works">
      <div class="works__grid"></div>
    </section>

    <!-- Next sections: subscriptions -->
  </main>

  <script src="js/main.js" defer></script>
</body>
</html>
