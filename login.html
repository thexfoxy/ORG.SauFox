<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Language: the visitor's choice, else Persian if their browser prefers
    // it. A Persian page stays hidden until js/main.js has put its text in.
    (function () {
      var lang = "en";
      try {
        // ?lang=fa or ?lang=en in the address wins (links, search engines).
        var asked = /[?&]lang=(fa|en)(&|$)/.exec(location.search);
        if (asked) lang = asked[1];
        if (asked) localStorage.setItem("saufox.lang", lang);
        else lang = localStorage.getItem("saufox.lang") ||
          ((navigator.languages || [navigator.language]).some(function (l) { return /^fa\b/i.test(l); }) ? "fa" : "en");
      } catch (e) {}
      if (lang !== "fa") return;
      var root = document.documentElement;
      root.lang = "fa";
      root.dir = "rtl";
      root.classList.add("i18n-pending");
      setTimeout(function () { root.classList.remove("i18n-pending"); }, 2500);
    })();
  </script>
  <title>Login · SauFox Entertainment</title>
  <meta name="description" content="Log in to SauFox Entertainment or create an account.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#0f0f11">
  <meta name="robots" content="noindex">
  <link rel="preload" href="assets/fonts/great-vibes.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/barlow-condensed-700i.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=42">
</head>
<body class="login-page">
  <!-- Background: slanted strips of artwork from the studio's releases,
       filled at random by js/main.js. -->
  <div class="login-bg" aria-hidden="true"></div>

  <main class="login">
    <button class="lang-switch lang-switch--corner" type="button" data-lang-switch translate="no">فارسی</button>
    <a class="login__brand" href="index.html">SauFox <span>Entertainment</span></a>

    <div class="auth">
      <!-- Left: tabs and the two forms, which slide past each other. -->
      <div class="auth__main">
        <div class="auth__top">
          <span class="auth__logo" aria-hidden="true">S</span>
          <div class="auth__tabs" role="tablist" aria-label="Log in or sign up">
            <button class="auth__tab" id="tab-login" type="button" role="tab" aria-selected="true" aria-controls="form-login">Login</button>
            <button class="auth__tab" id="tab-signup" type="button" role="tab" aria-selected="false" aria-controls="form-signup">Sign Up</button>
            <span class="auth__tab-marker" aria-hidden="true"></span>
          </div>
        </div>

        <div class="auth__viewport">
          <div class="auth__slider">
            <div class="auth__slide" id="slide-login">
              <form class="auth__form" id="form-login" role="tabpanel" aria-labelledby="tab-login" novalidate>
                <label class="field">
                  <span class="field__label">Email</span>
                  <span class="field__box">
                    <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6 8.5-6"/></svg>
                    <input id="login-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
                  </span>
                </label>

                <label class="field">
                  <span class="field__label">Password</span>
                  <span class="field__box">
                    <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
                    <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>
                    <button class="field__reveal" type="button" aria-label="Show password" aria-pressed="false">
                      <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                      <svg class="eye-shut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                    </button>
                  </span>
                </label>

                <button class="auth__forgot" type="button" data-action="forgot">Forgot password?</button>

                <p class="auth__message" role="status" aria-live="polite"></p>
                <button class="auth__submit" type="submit">Login</button>
              </form>

              <!-- Forgot password: asks for the email; a code arrives by email
                   and is entered in the code form below. -->
              <form class="auth__form" id="form-reset" novalidate hidden>
                <p class="auth__intro">Enter the email you signed up with and we&rsquo;ll email you a code to set a new password.</p>
                <label class="field">
                  <span class="field__label">Email</span>
                  <span class="field__box">
                    <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6 8.5-6"/></svg>
                    <input id="reset-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
                  </span>
                </label>

                <p class="auth__message" role="status" aria-live="polite"></p>
                <button class="auth__submit" type="submit">Send code</button>
                <button class="auth__forgot auth__forgot--back" type="button" data-action="back-to-login">Back to login</button>
              </form>

              <!-- The emailed 6-digit code, after sign-up, after the password
                   at login, and for a forgotten password (with the new one). -->
              <form class="auth__form" id="form-code" novalidate hidden>
                <p class="auth__intro" data-slot="code-intro"></p>
                <label class="field">
                  <span class="field__label">Code</span>
                  <span class="field__box field__box--code">
                    <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" placeholder="------" required>
                  </span>
                </label>

                <label class="field" data-slot="new-password" hidden>
                  <span class="field__label">New password</span>
                  <span class="field__box">
                    <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
                    <input id="code-password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required>
                    <button class="field__reveal" type="button" aria-label="Show password" aria-pressed="false">
                      <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                      <svg class="eye-shut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                    </button>
                  </span>
                </label>

                <p class="auth__message" role="status" aria-live="polite"></p>
                <button class="auth__submit" type="submit">Verify</button>
                <div class="auth__links">
                  <button class="auth__forgot" type="button" data-action="resend">Send a new code</button>
                  <button class="auth__forgot" type="button" data-action="code-back">Back to login</button>
                </div>
              </form>
            </div>

            <form class="auth__form" id="form-signup" role="tabpanel" aria-labelledby="tab-signup" novalidate>
              <label class="field">
                <span class="field__label">Name</span>
                <span class="field__box">
                  <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
                  <input id="signup-name" name="name" type="text" autocomplete="name" placeholder="Your name" required>
                </span>
              </label>

              <label class="field">
                <span class="field__label">Email</span>
                <span class="field__box">
                  <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6 8.5-6"/></svg>
                  <input id="signup-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
                </span>
              </label>

              <label class="field">
                <span class="field__label">Password</span>
                <span class="field__box">
                  <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
                  <input id="signup-password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required>
                  <button class="field__reveal" type="button" aria-label="Show password" aria-pressed="false">
                    <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="eye-shut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                  </button>
                </span>
              </label>

              <p class="auth__message" role="status" aria-live="polite"></p>
              <button class="auth__submit" type="submit">Create account</button>
            </form>
          </div>
        </div>

        <!-- Cloudflare Turnstile shows here only if it needs a tick. -->
        <div class="auth__captcha"></div>

        <div class="auth__or"><span>or</span></div>

        <div class="auth__social">
          <button class="social" type="button" data-provider="Google">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.3c0-.8-.1-1.5-.2-2.3H12v4.3h6c-.3 1.4-1 2.5-2.2 3.3v2.8h3.6c2.1-1.9 3.2-4.8 3.2-8.1z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.8c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.9C3.9 20.6 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.8 14.1c-.2-.7-.4-1.4-.4-2.1s.1-1.5.4-2.1V7H2.1C1.4 8.5 1 10.2 1 12s.4 3.5 1.1 5l3.7-2.9z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2C17.5 2.1 15 1 12 1 7.7 1 3.9 3.4 2.1 7l3.7 2.9C6.7 7.3 9.1 5.4 12 5.4z"/></svg>
            <span>Continue with Google</span>
          </button>
        </div>
        <p class="auth__message auth__message--social" role="status" aria-live="polite"></p>
      </div>

      <!-- Right: an image in the corner and three curved layers of artwork
           over it (1, 2, 3 in the sketch). -->
      <div class="auth__art" aria-hidden="true">
        <span class="auth__band auth__band--1"></span>
        <span class="auth__band auth__band--2"></span>
        <span class="auth__band auth__band--3"></span>
      </div>
    </div>

    <p class="login__legal">
      <span data-only="en" translate="no">By creating an account you agree to the <a href="terms.html">Terms of use</a> and <a href="privacy.html">Privacy policy</a>.</span>
      <span data-only="fa">با ساختن حساب، <a href="terms.html">قوانین استفاده</a> و <a href="privacy.html">حریم خصوصی</a> را می‌پذیرید.</span>
    </p>
  </main>

  <script src="js/vendor/supabase.js?v=42" defer></script>
  <script src="js/fa.js?v=42" defer></script>
  <script src="js/main.js?v=42" defer></script>
</body>
</html>
