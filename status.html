<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Language: the visitor's choice, else Persian if their browser prefers
    // it. A Persian page stays hidden until js/main.js has put its text in.
    (function () {
      var lang = "en";
      try {
        lang = localStorage.getItem("saufox.lang") ||
          ((navigator.languages || [navigator.language]).some(function (l) { return /^fa\b/i.test(l); }) ? "fa" : "en");
      } catch (e) {}
      if (lang !== "fa") return;
      var root = document.documentElement;
      root.lang = "fa";
      root.dir = "rtl";
      root.classList.add("i18n-pending");
      setTimeout(function () { root.classList.remove("i18n-pending"); }, 2500);
    })();
  </script>
  <meta name="robots" content="noindex">
  <title>SauFox Entertainment</title>
  <link rel="preload" href="/assets/fonts/great-vibes.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/style.css?v=37">
</head>
<body class="status-page">
  <!-- Site status: status.html?reason=maintenance | offline | forbidden | error. js/main.js (statusPage) fills it in; maintenance and offline check again by themselves and go back when the site is up.
       Paths start at the site root: a missing page can be at any depth. -->
  <header class="status-top">
    <a class="status-brand" href="/index.html">SauFox <span>Entertainment</span></a>
    <button class="lang-switch" type="button" data-lang-switch translate="no">فارسی</button>
  </header>

  <main class="status" data-reason="error">
    <p class="status__mark" aria-hidden="true" translate="no"></p>
    <h1 class="status__title"></h1>
    <p class="status__text"></p>
    <p class="status__note" translate="no" hidden></p>
    <div class="status__actions"></div>
    <p class="status__hint" role="status" aria-live="polite"></p>
  </main>

  <script src="/js/fa.js?v=37" defer></script>
  <script src="/js/main.js?v=37" defer></script>
</body>
</html>
