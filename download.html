  <script>
    // Clean addresses: never ".html" in the address bar (GitHub Pages
    // serves /download for download.html), and the home page is just "/".
    (function () {
      if (window.top !== window.self) {
        document.documentElement.style.display = "none";
        try { window.top.location = window.location.href; } catch (e) {}
        return;
      }
      try {
        var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
        var fresh = nav && (nav.type === "reload" || nav.type === "back_forward");
        var p = location.pathname, c = p.replace(/\/index\.html$/, "/").replace(/\.html$/, "");
        var hash = fresh ? "" : location.hash;
        if (c !== p || hash !== location.hash) history.replaceState(history.state, "", c + location.search + hash);
        if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      } catch (e) {}
    })();
  </script>
  <script>
    // Language: the visitor's choice, else Persian if their browser prefers it.
    (function () {
      var lang = "en";
      try {
        var asked = /[?&]lang=(fa|en)(&|$)/.exec(location.search);
        if (asked) lang = asked[1];
        if (asked) localStorage.setItem("saufox.lang", lang);
        else lang = localStorage.getItem("saufox.lang") ||
          ((navigator.languages || [navigator.language]).some(function (l) { return /^fa\b/i.test(l); }) ? "fa" : "en");
      } catch (e) {}
      if (lang !== "fa") return;
      var root = document.documentElement;
      root.lang = "fa";
      root.dir = "rtl";
      root.classList.add("i18n-pending");
      setTimeout(function () { root.classList.remove("i18n-pending"); }, 2500);
    })();
  </script>

  <style>
    /* One job: download the launcher. A slow collage of the studio's work
       behind, and a single button that slides in. Scoped to .dlp. */
    html, body { height: 100%; }
    body.dl-body { margin: 0; overflow: hidden; background: #08080b; }
    .dlp {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      isolation: isolate;
      overflow: hidden;
    }

    /* The collage: tilted rows of artwork drifting sideways, alternate rows
       the other way. Always left-to-right (pictures never mirror in Persian). */
    .dlp__collage {
      position: absolute;
      inset: -30% -20%;
      z-index: 0;
      display: grid;
      align-content: center;
      gap: 16px;
      transform: rotate(-9deg);
      pointer-events: none;
    }
    .dlp__row { overflow: visible; }
    .dlp__track {
      display: flex;
      gap: 16px;
      width: max-content;
      animation: dlp-drift var(--speed, 90s) linear infinite;
    }
    .dlp__row:nth-child(even) .dlp__track { animation-direction: reverse; }
    .dlp__tile {
      flex: none;
      width: clamp(200px, 22vw, 340px);
      aspect-ratio: 16 / 10;
      border-radius: 18px;
      object-fit: cover;
      background: #141317;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .dlp__tile.is-in { opacity: 1; }
    @keyframes dlp-drift { to { transform: translateX(-50%); } }

    /* Darkens the art so the button stands out, more toward the middle. */
    .dlp__shade {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(60% 55% at 50% 50%, rgba(8, 8, 11, 0.86), rgba(8, 8, 11, 0.55) 70%, rgba(8, 8, 11, 0.8) 100%),
        linear-gradient(180deg, rgba(8, 8, 11, 0.7), transparent 30%, transparent 70%, rgba(8, 8, 11, 0.85));
    }

    .dlp__top {
      position: absolute;
      z-index: 3;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
    }
    .dlp__brand img { display: block; height: 26px; width: auto; filter: drop-shadow(0 2px 14px rgba(0, 0, 0, 0.7)); }

    /* The button */
    .dlp__button {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 20px 34px;
      border-radius: 999px;
      font: 700 clamp(17px, 2vw, 20px)/1 var(--font-body);
      color: #fff;
      text-decoration: none;
      background: linear-gradient(180deg, #ff9a45, #ff6a0a);
      box-shadow:
        0 18px 40px -12px rgba(255, 100, 10, 0.8),
        0 0 0 1px rgba(255, 190, 130, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
      animation: dlp-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s;
    }
    .dlp__button:hover {
      transform: translateY(-3px);
      box-shadow:
        0 26px 52px -12px rgba(255, 100, 10, 0.95),
        0 0 0 1px rgba(255, 210, 160, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }
    .dlp__button:active { transform: translateY(1px); transition-duration: 0.1s; }
    .dlp__button:focus-visible { outline: 2px solid #ffd2a8; outline-offset: 5px; }
    .dlp__button svg { width: 24px; height: 24px; flex: none; fill: currentColor; }
    @keyframes dlp-in {
      from { opacity: 0; transform: translateY(46px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .dlp__track, .dlp__button { animation: none; }
    }
  </style>

  <script>
    // The collage: this site's own artwork straight away, then the studio's
    // published works once the catalogue loads (js/main.js).
    (function () {
      var box = document.querySelector(".dlp__collage");
      // Enough rows to fill the (tilted) screen top to bottom.
      var tileHeight = Math.min(340, Math.max(200, innerWidth * 0.22)) * 10 / 16 + 16;
      var ROWS = Math.max(4, Math.ceil((innerHeight * 1.6) / tileHeight));
      var shown = "";
      function build(pictures) {
        var key = pictures.join("|");
        if (!pictures.length || key === shown) return;
        shown = key;
        box.textContent = "";
        for (var r = 0; r < ROWS; r++) {
          // Each row starts somewhere else in the list, and holds enough
          // tiles to cover a wide screen; then the same again, so the drift
          // loops without a seam.
          var list = [];
          for (var i = 0; list.length < Math.max(8, pictures.length); i++) list.push(pictures[(i + r * 3) % pictures.length]);
          var row = document.createElement("div");
          row.className = "dlp__row";
          var track = document.createElement("div");
          track.className = "dlp__track";
          track.style.setProperty("--speed", (80 + r * 18) + "s");
          list.concat(list).forEach(function (src) {
            var img = document.createElement("img");
            img.className = "dlp__tile";
            img.alt = "";
            img.decoding = "async";
            img.onload = function () { img.classList.add("is-in"); };
            img.src = src;
            track.append(img);
          });
          row.append(track);
          box.append(row);
        }
      }
      var local = ["hero", "1", "2", "3", "4", "5", "6", "poster"].map(function (n) { return "assets/works/candlewood-" + n + ".webp"; });
      build(local);
      document.addEventListener("DOMContentLoaded", function () {
        if (typeof catalog === "undefined") return;
        catalog.then(function (works) {
          var seen = {}, pictures = [];
          works.forEach(function (w) {
            [w.hero].concat(w.stills || [], w.images || []).forEach(function (src) {
              if (src && !seen[src]) { seen[src] = 1; pictures.push(src); }
            });
          });
          if (pictures.length >= local.length) build(pictures);
        });
      });
    })();
  </script>
