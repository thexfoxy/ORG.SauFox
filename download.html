  <script>
    // Clean addresses: never ".html" in the address bar (GitHub Pages
    // serves /download for download.html), and the home page is just "/".
    (function () {
      if (window.top !== window.self) {
        document.documentElement.style.display = "none";
        try { window.top.location = window.location.href; } catch (e) {}
        return;
      }
      try {
        var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
        var fresh = nav && (nav.type === "reload" || nav.type === "back_forward");
        var p = location.pathname, c = p.replace(/\/index\.html$/, "/").replace(/\.html$/, "");
        var hash = fresh ? "" : location.hash;
        if (c !== p || hash !== location.hash) history.replaceState(history.state, "", c + location.search + hash);
        if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      } catch (e) {}
    })();
  </script>
  <script>
    // Language: the visitor's choice, else Persian if their browser prefers it.
    (function () {
      var lang = "en";
      try {
        var asked = /[?&]lang=(fa|en)(&|$)/.exec(location.search);
        if (asked) lang = asked[1];
        if (asked) localStorage.setItem("saufox.lang", lang);
        else lang = localStorage.getItem("saufox.lang") ||
          ((navigator.languages || [navigator.language]).some(function (l) { return /^fa\b/i.test(l); }) ? "fa" : "en");
      } catch (e) {}
      if (lang !== "fa") return;
      var root = document.documentElement;
      root.lang = "fa";
      root.dir = "rtl";
      root.classList.add("i18n-pending");
      setTimeout(function () { root.classList.remove("i18n-pending"); }, 2500);
    })();
  </script>

  <style>
    /* One job: download the launcher. A slow collage of the studio's work
       behind, and a single button that slides in. Scoped to .dlp. */
    html, body { height: 100%; }
    body.dl-body { margin: 0; overflow: hidden; background: #08080b; }
    .dlp {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      isolation: isolate;
      overflow: hidden;
    }

    /* The collage: tilted rows of artwork drifting sideways, alternate rows
       the other way. Always left-to-right (pictures never mirror in Persian). */
    .dlp__collage {
      position: absolute;
      inset: -30% -20%;
      z-index: 0;
      display: grid;
      align-content: center;
      align-items: center;
      gap: 16px;
      transform: rotate(-9deg);
      pointer-events: none;
    }
    .dlp__row { overflow: visible; }
    .dlp__track {
      display: flex;
      gap: 16px;
      width: max-content;
      animation: dlp-drift var(--speed, 90s) linear infinite;
    }
    .dlp__row:nth-child(even) .dlp__track { animation-direction: reverse; }
    .dlp__tile {
      flex: none;
      height: var(--h, 200px);
      border-radius: 16px;
      object-fit: cover;
      background: #141317;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .dlp__tile--wide { aspect-ratio: 16 / 9; }
    .dlp__tile--tall { aspect-ratio: 2 / 3; }
    .dlp__tile.is-in { opacity: 1; }
    @keyframes dlp-drift { to { transform: translateX(-50%); } }

    /* Darkens the art so the button stands out, more toward the middle. */
    .dlp__shade {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(60% 55% at 50% 50%, rgba(8, 8, 11, 0.86), rgba(8, 8, 11, 0.55) 70%, rgba(8, 8, 11, 0.8) 100%),
        linear-gradient(180deg, rgba(8, 8, 11, 0.7), transparent 30%, transparent 70%, rgba(8, 8, 11, 0.85));
    }

    .dlp__top {
      position: absolute;
      z-index: 3;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
    }
    .dlp__brand img { display: block; height: 26px; width: auto; filter: drop-shadow(0 2px 14px rgba(0, 0, 0, 0.7)); }

    /* The text and the button: plain, sliding up into place. */
    .dlp__main {
      position: relative;
      z-index: 2;
      display: grid;
      justify-items: center;
      gap: 26px;
      padding: 0 20px;
      text-align: center;
      color: #f6f4ef;
      font-family: var(--font-body);
      animation: dlp-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
    }
    .dlp__title {
      margin: 0;
      font-size: clamp(28px, 4vw, 44px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .dlp__about {
      margin: 10px 0 0;
      font-size: clamp(14px, 1.5vw, 16px);
      line-height: 1.8;
      color: rgba(246, 244, 239, 0.72);
    }
    .dlp__button {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 15px 30px;
      border: 1.5px solid rgba(255, 255, 255, 0.55);
      border-radius: 999px;
      font: 600 17px/1 var(--font-body);
      color: #fff;
      text-decoration: none;
      background: none;
      transition: border-color 0.25s, color 0.25s, transform 0.25s;
    }
    .dlp__button:hover { border-color: #ff8a2e; color: #ff8a2e; }
    .dlp__button:active { transform: scale(0.98); }
    .dlp__button:focus-visible { outline: 2px solid #ffd2a8; outline-offset: 4px; }
    .dlp__button svg { width: 20px; height: 20px; flex: none; fill: currentColor; }
    @keyframes dlp-in {
      from { opacity: 0; transform: translateY(46px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .dlp__track, .dlp__main { animation: none; }
    }
  </style>

  <script>
    // The collage: only the works' banners (each work's wide hero art and
    // its tall cover), in rows of different heights. It comes from the
    // published catalogue (js/main.js), so new banners show up by themselves.
    (function () {
      var box = document.querySelector(".dlp__collage");
      var shown = "";
      function build(banners) {
        var key = banners.map(function (b) { return b.src; }).join("|");
        if (!banners.length || key === shown) return;
        shown = key;
        box.textContent = "";
        var small = innerWidth < 700;
        var heights = small ? [150, 210, 120, 180] : [210, 290, 170, 250];
        var filled = 0, r = 0;
        // Enough rows to fill the tilted screen from top to bottom.
        while (filled < innerHeight * 1.7) {
          var height = heights[r % heights.length];
          var list = [];
          var width = 0;
          // Wide enough to cover the screen, then the same again so the drift
          // loops without a seam.
          for (var i = 0; width < innerWidth * 1.6 || list.length < 4; i++) {
            var b = banners[(i + r * 2) % banners.length];
            list.push(b);
            width += height * (b.wide ? 16 / 9 : 2 / 3) + 16;
          }
          var row = document.createElement("div");
          row.className = "dlp__row";
          var track = document.createElement("div");
          track.className = "dlp__track";
          track.style.setProperty("--speed", (70 + r * 13) % 120 + 50 + "s");
          list.concat(list).forEach(function (b) {
            var img = document.createElement("img");
            img.className = "dlp__tile " + (b.wide ? "dlp__tile--wide" : "dlp__tile--tall");
            img.style.setProperty("--h", height + "px");
            img.alt = "";
            img.decoding = "async";
            img.onload = function () { img.classList.add("is-in"); };
            img.src = b.src;
            track.append(img);
          });
          row.append(track);
          box.append(row);
          filled += height + 16;
          r++;
        }
      }
      document.addEventListener("DOMContentLoaded", function () {
        if (typeof catalog === "undefined") return;
        catalog.then(function (works) {
          var seen = {}, banners = [];
          works.forEach(function (w) {
            [[w.hero, true], [(w.images || [])[0], false]].forEach(function (pair) {
              if (pair[0] && !seen[pair[0]]) { seen[pair[0]] = 1; banners.push({ src: pair[0], wide: pair[1] }); }
            });
          });
          build(banners);
        });
      });
    })();
  </script>
